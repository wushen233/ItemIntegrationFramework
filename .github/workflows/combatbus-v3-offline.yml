name: CombatBus V3 Offline Windows

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/combatbus-v3-offline.yml'
      - 'research/combatbus-v3-offline/**'
      - 'research/combatbus-v3-runtime-smoke/**'

permissions:
  contents: read

concurrency:
  group: combatbus-v3-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 / ${{ matrix.toolchain }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, clangcl]
    env:
      XMAKE_BUILD_DIR: ${{ github.workspace }}\_ci\combatbus-v3-${{ matrix.toolchain }}
      CTEST_DIR: ${{ github.workspace }}\_ci\ctest-combatbus-v3-${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1.2.5
        with:
          xmake-version: '3.0.2'

      - name: Report toolchain versions
        shell: pwsh
        run: |
          xmake --version
          cmake --version
          ctest --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1).Trim()
          if (-not $vs) { throw 'Visual Studio 2022 installation not found' }
          $devCmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd)) { throw 'VsDevCmd.bat not found' }
          $pathCommand = 'call "' + $devCmd + '" -no_logo -arch=x64 && where.exe cl.exe && where.exe link.exe'
          $toolPaths = & cmd.exe /d /s /c $pathCommand
          if ($LASTEXITCODE -ne 0) { throw "MSVC tool discovery failed: $LASTEXITCODE" }
          $clPath = ($toolPaths | Where-Object { $_ -match '(?i)\\cl\.exe$' } | Select-Object -First 1).Trim()
          $linkPath = ($toolPaths | Where-Object { $_ -match '(?i)\\link\.exe$' } | Select-Object -First 1).Trim()
          if (-not $clPath -or -not $linkPath) { throw 'MSVC compiler or linker was not found in the x64 developer environment' }
          Write-Host "MSVC compiler file version: $((Get-Item -LiteralPath $clPath).VersionInfo.FileVersion)"
          Write-Host "MSVC linker file version: $((Get-Item -LiteralPath $linkPath).VersionInfo.FileVersion)"
          if ('${{ matrix.toolchain }}' -eq 'clangcl') {
            $clang = Join-Path $vs 'VC\Tools\Llvm\bin\clang-cl.exe'
            if (-not (Test-Path -LiteralPath $clang)) { throw 'Visual Studio Clang-cl toolset is unavailable' }
            & $clang --version
            if ($LASTEXITCODE -ne 0) { throw "clang-cl version query failed: $LASTEXITCODE" }
          }

      - name: Configure selected xmake toolchain
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'research\combatbus-v3-offline'
          $xmakeBuildDir = '_ci/combatbus-v3-${{ matrix.toolchain }}'
          if ('${{ matrix.toolchain }}' -eq 'clangcl') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1).Trim()
            if (-not $vs) { throw 'Visual Studio installation not found for Clang-cl' }
            $clang = Join-Path $vs 'VC\Tools\Llvm\bin\clang-cl.exe'
            if (-not (Test-Path -LiteralPath $clang)) { throw 'Visual Studio Clang-cl toolset is unavailable' }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $clang)
            $env:Path = (Split-Path -Parent $clang) + [IO.Path]::PathSeparator + $env:Path
            & xmake config "--project=$project" -p windows -a x64 -m release --toolchain=clang-cl --cc=clang-cl --cxx=clang-cl "--builddir=$xmakeBuildDir"
          }
          else {
            & xmake config "--project=$project" -p windows -a x64 -m release --toolchain=msvc "--builddir=$xmakeBuildDir"
          }
          if ($LASTEXITCODE -ne 0) { throw "xmake configuration failed: $LASTEXITCODE" }
          $targetInfo = (& xmake show "--project=$project" -t combatbus_cross_dll_host | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "xmake toolchain report failed: $LASTEXITCODE" }
          Write-Host $targetInfo
          if ('${{ matrix.toolchain }}' -eq 'clangcl' -and $targetInfo -notmatch '(?i)clang-cl') {
            throw 'xmake did not select clang-cl for the cross-DLL Host target'
          }
          if ('${{ matrix.toolchain }}' -eq 'msvc' -and $targetInfo -notmatch '(?i)compiler \(cxx\).*cl\.exe') {
            throw 'xmake did not select MSVC for the cross-DLL Host target'
          }

      - name: Build all ABI and lifecycle targets
        shell: pwsh
        run: xmake build "--project=$env:GITHUB_WORKSPACE/research/combatbus-v3-offline" --all --jobs=2 --verbose

      - name: Configure CTest manifest for xmake outputs
        shell: pwsh
        run: |
          cmake -S research/combatbus-v3-offline -B "$env:CTEST_DIR" -G "Visual Studio 17 2022" -A x64 `
            "-DCOMBATBUS_EXTERNAL_BINARY_DIR=$env:XMAKE_BUILD_DIR\windows\x64"
          if ($LASTEXITCODE -ne 0) { throw "CTest manifest configuration failed: $LASTEXITCODE" }

      - name: Run complete CTest suite
        shell: pwsh
        run: ctest --test-dir "$env:CTEST_DIR" -C Release --output-on-failure --verbose --parallel 1 --output-junit "$env:CTEST_DIR\ctest-results.xml"

      - name: Verify traces and report artifact hashes
        shell: pwsh
        run: |
          $bin = Join-Path $env:XMAKE_BUILD_DIR 'windows\x64\release'
          $required = @(
            'combatbus_phase1o_fixtures.exe',
            'combatbus_cross_dll_host.exe',
            'combatbus_startup_probe.exe',
            'combatbus_iif_mock.dll',
            'combatbus_test_provider.dll',
            'combatbus_test_provider_missing_export.dll'
          )
          foreach ($name in $required) {
            $path = Join-Path $bin $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing expected test artifact: $name" }
          }
          $probe = Get-Content -Raw (Join-Path $env:CTEST_DIR 'startup-probe.trace')
          foreach ($marker in @('probe.wmain.entered', 'probe.before_return')) {
            if (-not $probe.Contains($marker)) { throw "Startup probe marker missing: $marker" }
          }
          $hostTrace = Get-Content -Raw (Join-Path $env:CTEST_DIR 'cross-dll-startup.trace')
          $hostMarkers = @(
            'host.wmain.entered', 'host.before_host_dll_load', 'host.host_dll_loaded',
            'host.before_provider_dll_load', 'host.provider_dll_loaded', 'host.before_provider_reload',
            'host.provider_reloaded', 'host.shutdown_drained', 'host.modules_unloaded',
            'host.test_finished', 'host.before_normal_exit'
          )
          $previous = -1
          foreach ($marker in $hostMarkers) {
            $position = $hostTrace.IndexOf($marker)
            if ($position -le $previous) { throw "Host startup/lifecycle marker missing or out of order: $marker" }
            $previous = $position
          }
          $junit = [xml](Get-Content -Raw (Join-Path $env:CTEST_DIR 'ctest-results.xml'))
          if ([int]$junit.testsuite.failures -ne 0 -or [int]$junit.testsuite.tests -lt 7) {
            throw 'CTest JUnit summary reports a failure or fewer than seven tests'
          }
          Write-Host "CTest: $($junit.testsuite.tests) tests; $($junit.testsuite.failures) failures"
          Get-ChildItem -LiteralPath $bin -File | Where-Object { $_.Extension -in @('.exe', '.dll') } |
            Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              Write-Host "$($_.Name) SHA256 $hash"
            }
